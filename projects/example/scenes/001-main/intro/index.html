<!doctype html>
<meta charset="utf-8">
<meta name="duration" content="4">
<meta name="props" content='{"title":"Composive","x":0.5,"y":0.5}'>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: linear-gradient(135deg, #1b2a49, #5b2a86); font: 700 120px system-ui, sans-serif; color: #fff; }
  #t { position: absolute; width: max-content; }
</style>
<div id="t"></div>
<script src="/lib/gsap/gsap.min.js"></script>
<script src="/lib/composive.js"></script>
<script>
  const t = document.getElementById("t");
  composive.clip({
    update: (p) => { t.textContent = p.title; composive.place(t, p); },
    timeline: (tl, p, duration) => {
      gsap.set(t, { xPercent: -50, yPercent: -50 }); // centered (GSAP owns the transform)
      tl.from(t, { y: 80, opacity: 0, duration: 1, ease: "power3.out" })
        .to(t, { opacity: 0, duration: 0.5 }, duration - 0.5);
    },
  });
</script>
