<!doctype html>
<meta charset="utf-8">
<meta name="duration" content="3">
<meta name="props" content='{"text":"Simple online video editor"}'>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #bar { position: absolute; left: 120px; bottom: 140px; padding: 20px 36px; background: #fff; color: #111; font: 600 48px system-ui, sans-serif; }
</style>
<div id="bar"></div>
<script src="/lib/composive.js"></script>
<script>
  // No GSAP: update() draws each frame from t
  const bar = document.getElementById("bar");
  composive.clip({
    update: (p, t) => {
      bar.textContent = p.text;
      bar.style.transform = `translateX(${(1 - composive.ease.out(composive.range(t, 0, 0.6))) * -600}px)`;
    },
    fadeOut: 0.4,
  });
</script>
