<!doctype html>
<meta charset="utf-8">
<meta name="duration" content="3">
<meta name="props" content='{"text":"Simple online video editor"}'>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #bar { position: absolute; left: 120px; bottom: 140px; padding: 20px 36px; background: #fff; color: #111; font: 600 48px system-ui, sans-serif; }
</style>
<div id="bar">Simple online video editor</div>
<script>
  window.seek = (t, duration, props = { text: "Simple online video editor" }) => {
    document.getElementById("bar").textContent = props.text;
    const p = Math.min(1, t / 0.6), e = 1 - Math.pow(1 - p, 3);
    const out = Math.min(1, Math.max(0, (duration - t) / 0.4));
    const bar = document.getElementById("bar");
    bar.style.transform = `translateX(${(1 - e) * -600}px)`;
    bar.style.opacity = out;
  };
  seek(0, 3);
</script>
