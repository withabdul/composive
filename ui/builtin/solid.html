<!doctype html>
<meta charset="utf-8">
<!-- Built-in color solid ("@solid"): fills the frame, e.g. a background. -->
<meta name="duration" content="5">
<meta name="props" content='{"color":"#1b2a49","opacity":1}'>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #s { position: absolute; inset: 0; }
</style>
<div id="s"></div>
<script>
  const s = document.getElementById("s");
  window.seek = (_time, _duration, p) => {
    s.style.background = p.color;
    s.style.opacity = p.opacity;
  };
</script>
